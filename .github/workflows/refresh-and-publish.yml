name: Refresh and publish Finance Radar
on:
  push:
    branches: [main]
  schedule:

    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: finance-radar-refresh
  cancel-in-progress: false
jobs:
  collect-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Check out project
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Check parsing and repeat-run behaviour
        run: python -m pytest -q tests/test_collector.py
      - name: Refresh the public feed
        run: python scripts/collect.py
      - name: Save source-health diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-health-and-feed
          path: |
            data/health.json
            data/feed.json
            data/new_events.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Send optional alerts for newly confirmed events
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RADAR_RECIPIENT_EMAIL: ${{ secrets.RADAR_RECIPIENT_EMAIL }}
          RADAR_FROM_EMAIL: ${{ secrets.RADAR_FROM_EMAIL }}
        run: python scripts/notify.py
      - name: Persist state for the next scan
        run: |
          git config user.name 'Finance Radar automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/feed.json data/live.js data/health.json data/new_events.json data/notified.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh public finance events'
            # A source or workflow update may have landed while the scan ran.
            # Replay our generated snapshot on top of the latest branch before publishing.
            for attempt in 1 2 3; do
              git fetch origin "${GITHUB_REF_NAME}"
              git rebase -X ours "origin/${GITHUB_REF_NAME}"
              if git push origin "HEAD:${GITHUB_REF_NAME}"; then
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                echo "Could not persist the refreshed feed after three attempts" >&2
                exit 1
              fi
            done
          fi
      - name: Package static website
        run: |
          mkdir -p _site/data
          cp index.html _site/index.html
          cp data/feed.json data/live.js data/health.json _site/data/
          touch _site/.nojekyll
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Publish website
        id: deploy
        uses: actions/deploy-pages@v4
